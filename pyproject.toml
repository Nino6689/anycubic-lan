[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anycubic-lan"
version = "0.1.0"
description = "Async client for Anycubic 3D printers in LAN Mode (local MQTT, no cloud)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Nino Bondonno" }]
keywords = ["anycubic", "3d-printer", "mqtt", "asyncio", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10",
    "cryptography>=43",
    "paho-mqtt>=2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[project.urls]
Source = "https://github.com/Nino6689/anycubic-lan"
Issues = "https://github.com/Nino6689/anycubic-lan/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/anycubic_lan"]

[tool.hatch.build.targets.sdist]
include = ["src/anycubic_lan", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=anycubic_lan --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["anycubic_lan"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "TC",    # flake8-type-checking
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src"]
